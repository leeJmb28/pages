*{box-sizing:border-box;margin:0;padding:0}
:root{

  --sp-bg:#F6F6F4;--sp-surface:#FFFFFF;--sp-surface2:#F0F0EE;
  --sp-border:#E0DFDB;--sp-border2:#C8C7C2;
  --sp-text:#121212;--sp-muted:#6B6B6B;
  --sp-p0:#E24B4A;--sp-p0bg:#FCEBEB;
  --sp-p1:#BA7517;--sp-p1bg:#FAEEDA;
  --sp-tech:#185FA5;--sp-techbg:#E6F1FB;

  --sp-now-bg:#e6f9ed;--sp-now-fg:#157a38;
  --sp-next-bg:#E6F1FB;--sp-next-fg:#185FA5;
  --sp-later-bg:#F1EFE8;--sp-later-fg:#5F5E5A;
  --radius-md:6px;--radius-lg:10px;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{background:var(--sp-bg);min-height:100vh;display:flex;justify-content:center;padding:2rem 1rem;font-family:var(--font-sans)}
.wrap{background:var(--sp-bg);padding:1.5rem;width:100%;max-width:860px}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:0 0 1rem;border-bottom:1px solid var(--sp-border);margin-bottom:1.5rem}
.logo-dot{width:10px;height:10px;border-radius:50%;background:var(--sp-green);display:inline-block;margin-right:8px;flex-shrink:0}
.top-title{font-size:18px;font-weight:600;color:var(--sp-text);display:flex;align-items:center}
.top-meta{font-size:12px;color:var(--sp-muted)}
.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
.metric{background:var(--sp-surface);border-radius:var(--radius-md);padding:.875rem;text-align:center;border:1px solid var(--sp-border)}
.metric-label{font-size:11px;color:var(--sp-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.metric-value{font-size:22px;font-weight:600;color:var(--sp-text)}
.filters{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap}
.filter-btn{font-size:12px;padding:5px 14px;border-radius:20px;border:1px solid var(--sp-border);background:var(--sp-surface);color:var(--sp-muted);cursor:pointer;transition:all .15s;font-weight:500}
.filter-btn:hover{border-color:var(--sp-border2);color:var(--sp-text)}
.filter-btn.active{background:var(--sp-green);color:#fff;border-color:var(--sp-green);font-weight:600}
.okr-list{display:flex;flex-direction:column;gap:10px}
.okr-card{background:var(--sp-surface);border:1px solid var(--sp-border);border-radius:var(--radius-lg);overflow:hidden;transition:box-shadow .15s,border-color .15s}
.okr-card:hover{border-color:var(--sp-border2);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.okr-card.p0-card{border-left:3px solid var(--sp-p0)}
.okr-card.p1-card{border-left:3px solid var(--sp-p1)}
.okr-header{display:flex;align-items:flex-start;gap:12px;padding:1rem 1.25rem;cursor:pointer;user-select:none}
.okr-icon{width:36px;height:36px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.okr-meta{flex:1;min-width:0}
.okr-title-row{display:flex;align-items:center;gap:7px;margin-bottom:4px;flex-wrap:wrap}
.okr-title{font-size:14px;font-weight:600;color:var(--sp-text)}

.badge-tech{background:var(--sp-techbg);color:var(--sp-tech)}
.badge-prod{background:var(--sp-prodbg);color:var(--sp-prod)}
.badge-p0{background:var(--sp-p0bg);color:var(--sp-p0)}
.badge-p1{background:var(--sp-p1bg);color:var(--sp-p1)}
.okr-desc{font-size:12px;color:var(--sp-muted);line-height:1.5}
.okr-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.owner-chip{font-size:11px;color:var(--sp-muted);display:flex;align-items:center;gap:4px}
.expand-icon{font-size:15px;color:var(--sp-muted);transition:transform .2s}
.expanded .expand-icon{transform:rotate(180deg)}
.okr-body{display:none;padding:0 1.25rem 1.25rem;border-top:1px solid var(--sp-border)}
.okr-body.open{display:block}
.section-label{font-size:10px;font-weight:600;color:var(--sp-muted);margin:1rem 0 6px;text-transform:uppercase;letter-spacing:.08em}
.kr-list{display:flex;flex-direction:column;gap:6px}
.kr-item{display:flex;align-items:center;gap:10px;font-size:12px;background:var(--sp-surface2);border-radius:var(--radius-md);padding:8px 10px;cursor:pointer;transition:background .15s}
.kr-item:hover{background:#e6f9ed}
.kr-item:hover .kr-wbs-hint{opacity:1}

.kr-text{flex:1;color:var(--sp-text);line-height:1.5}
.kr-wbs-hint{font-size:10px;color:var(--sp-green-dark);opacity:0;transition:opacity .15s;white-space:nowrap;margin-right:4px}
.kr-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.kr-prog-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.kr-bar-bg{width:72px;height:4px;background:var(--sp-border);border-radius:2px;overflow:hidden}
.kr-bar{height:100%;border-radius:2px;background:var(--sp-green);transition:width .4s}
.kr-pct{font-size:10px;color:var(--sp-muted)}
.kr-tbd{font-size:10px;color:var(--sp-muted);font-style:italic}
.tier-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.tier-card{background:var(--sp-surface2);border:1px solid var(--sp-border);border-radius:var(--radius-md);padding:10px}
.tier-name{font-size:12px;font-weight:600;color:var(--sp-text);margin-bottom:5px;text-align:center}
.tier-stat{font-size:10px;color:var(--sp-muted);line-height:1.6;text-align:center}
.tier-revenue{font-size:11px;font-weight:600;color:var(--sp-green-dark);margin-top:4px;text-align:center}
.nnl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.nnl-col{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--sp-border)}
.nnl-header{font-size:11px;font-weight:600;padding:6px 10px;text-align:center;border-bottom:1px solid var(--sp-border)}
.nnl-body{padding:8px 10px;min-height:60px}
.nnl-item{font-size:11px;color:var(--sp-text);padding:3px 0;border-bottom:1px solid var(--sp-border);line-height:1.4;display:flex;gap:6px;align-items:flex-start}
.nnl-item:last-child{border-bottom:none}
.nnl-bullet{color:var(--sp-green);flex-shrink:0;font-weight:700}
.nnl-cond{font-size:10px;color:var(--sp-muted);font-style:italic;padding-top:4px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.show{opacity:1;pointer-events:all}
.modal{background:var(--sp-surface);border-radius:var(--radius-lg);width:100%;max-width:680px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}

function openWBS(oid,krIdx,krText){
  const key=oid+'KR'+(krIdx+1);
  const data=wbsData[key];
  document.getElementById('modal-kr-badge').textContent='KR'+(krIdx+1);
  document.getElementById('modal-title').textContent=krText.replace(/&lt;/g,'<').replace(/&amp;/g,'&');
  const grid=document.getElementById('modal-wp-grid');
  if(data&&data.wps.length){
    grid.innerHTML=data.wps.map(wp=>`
      <div class="wp-card">
        <div class="wp-id">${wp.id}</div>
        <div class="wp-title">${wp.title}</div>
        <div class="wp-meta">
          <span class="tag ${wp.owner}">${wp.ol}</span>
          <span class="tag ${wp.type}">${wp.tl}</span>
          ${wp.dep?`<span class="tag dep-tag">依賴 ${wp.dep}</span>`:''}
        </div>
      </div>`).join('');
  } else {
    grid.innerHTML='<div style="font-size:13px;color:var(--sp-muted);padding:8px 0">此 KR 尚未設定工作包</div>';
  }
  document.getElementById('modal-overlay').classList.add('show');
  document.body.style.overflow='hidden';
}

function closeModal(e){
  if(e.target===document.getElementById('modal-overlay')) closeModalDirect();
}
function closeModalDirect(){
  document.getElementById('modal-overlay').classList.remove('show');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModalDirect();});

function buildCard(o){
  const teamBadge=o.team==='tech'?'<span class="badge badge-tech">技術中心</span>':'<span class="badge badge-prod">產品團隊</span>';
  const priBadge=o.priority==='p0'?'<span class="badge badge-p0">P0</span>':'<span class="badge badge-p1">P1</span>';
  const krHtml=o.krs.map((k,i)=>`
    <div class="kr-item" onclick="openWBS('${o.id}',${i},'${k.t.replace(/'/g,"\\'")}')">
      <span class="kr-num">KR${i+1}</span>
      <span class="kr-text">${k.t}</span>
      <span class="kr-wbs-hint"><i class="ti ti-layout-grid" style="font-size:11px;vertical-align:-1px"></i> WBS</span>
      <div class="kr-right">
        <div class="kr-prog-wrap">
          ${k.tbd
            ?`<span class="kr-tbd">${k.label||'待補 baseline'}</span>`
            :`<div class="kr-bar-bg"><div class="kr-bar" style="width:${k.p}%"></div></div><span class="kr-pct">${k.label||(k.p+'%')}</span>`
          }
        </div>
      </div>
    </div>`).join('');
  const tierHtml=o.tiers?`
    <div class="section-label">收入模型假設（基於 10萬 MAU）</div>
    <div class="tier-row">${o.tiers.map(t=>`
      <div class="tier-card">
        <div class="tier-name">${t.name}</div>
        <div class="tier-stat">${t.stats}</div>
        <div class="tier-stat">${t.arppu}</div>
        <div class="tier-revenue">${t.rev}</div>
      </div>`).join('')}</div>`:'';
  const nnlCol=(label,bg,fg,items,cond)=>`
    <div class="nnl-col" style="background:${bg}">
      <div class="nnl-header" style="color:${fg}">${label}</div>
      <div class="nnl-body">
        ${items.map(t=>`<div class="nnl-item"><span class="nnl-bullet">·</span><span>${t}</span></div>`).join('')}
        ${cond?`<div class="nnl-cond">${cond}</div>`:''}
      </div>
    </div>`;
  const el=document.createElement('div');
  el.className=`okr-card ${o.priority}-card`;
  el.dataset.team=o.team;
  el.dataset.priority=o.priority;
  el.innerHTML=`
    <div class="okr-header" onclick="toggleCard(this)">
      <div class="okr-icon" style="background:${o.iconBg}">
        <i class="ti ${o.icon}" style="color:${o.iconColor};font-size:17px" aria-hidden="true"></i>
      </div>
      <div class="okr-meta">
        <div class="okr-title-row"><span class="okr-title">${o.title}</span>${teamBadge}${priBadge}</div>
        <div class="okr-desc">${o.desc}</div>
      </div>
      <div class="okr-right">
        <span class="owner-chip"><i class="ti ti-user" aria-hidden="true"></i>${o.owner}</span>
        <i class="ti ti-chevron-down expand-icon" aria-hidden="true"></i>
      </div>
    </div>
    <div class="okr-body">
      <div class="section-label">關鍵結果 KR <span style="font-size:9px;color:var(--sp-green-dark);font-weight:400;text-transform:none;letter-spacing:0">— 點擊查看工作包</span></div>
      <div class="kr-list">${krHtml}</div>
      ${tierHtml}
      <div class="section-label" style="margin-top:1rem">行動計畫</div>
      <div class="nnl">
        ${nnlCol('Now','var(--sp-now-bg)','var(--sp-now-fg)',o.now||[])}
        ${nnlCol('Next','var(--sp-next-bg)','var(--sp-next-fg)',o.next||[])}
        ${nnlCol('Later','var(--sp-later-bg)','var(--sp-later-fg)',o.later||[],o.laterCond)}
      </div>
    </div>`;
  return el;
}

function render(){const l=document.getElementById('okr-list');l.innerHTML='';okrData.forEach(o=>l.appendChild(buildCard(o)));}
function toggleCard(h){
  const c=h.closest('.okr-card');
  c.querySelector('.okr-body').classList.toggle('open');
  c.classList.toggle('expanded');
}
function filterCards(type,btn){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.okr-card').forEach(c=>{
    if(type==='all')c.style.display='';
    else if(type==='p0'||type==='p1')c.style.display=c.dataset.priority===type?'':'none';
    else c.style.display=c.dataset.team===type?'':'none';
  });
}
render();
</script>
