<title>行前手冊 — AWS 台韓媒體娛樂 AI 創新峰會</title>

<style>
:root{
  --aws-navy:#232F3E;--aws-navy-2:#1a2330;--aws-orange:#FF9900;--aws-orange-soft:#ffb84d;
  --kr-red:#CD2E3A;--kr-blue:#0047A0;--ink:#1a2330;--ink-soft:#4a5568;--muted:#8b96a5;
  --line:#e9edf2;--line-soft:#f1f4f8;--surface:#ffffff;--bg:#f6f8fb;--bg-tint:#eef2f8;--pending:#b0b8c4;
  --radius:18px;--radius-sm:12px;--shadow:0 10px 40px -12px rgba(28,42,66,.18);--shadow-soft:0 4px 18px -8px rgba(28,42,66,.22);
  --sans:'Noto Sans TC','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--display:'Space Grotesk','Noto Sans TC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.65;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
.sidebar{width:280px;flex-shrink:0;position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--aws-navy) 0%,var(--aws-navy-2) 100%);color:#fff;display:flex;flex-direction:column;z-index:40;box-shadow:4px 0 24px -12px rgba(0,0,0,.4)}
.sb-brand{padding:26px 24px 20px;border-bottom:1px solid rgba(255,255,255,.09)}
.sb-brand .logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.5px}
.sb-brand .logo b{color:var(--aws-orange)}
.sb-brand .logo i{color:var(--aws-orange)}
.sb-brand .sub{font-size:12px;color:#aab6c6;margin-top:8px;line-height:1.5}
.sb-brand .flags{font-size:14px;margin-top:10px;letter-spacing:.5px;color:#dbe3ec}
.sb-nav{flex:1;overflow-y:auto;padding:14px 12px}
.sb-nav::-webkit-scrollbar{width:6px}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;color:#c4cedb;text-decoration:none;font-size:14px;font-weight:500;cursor:pointer;transition:all .18s ease;margin-bottom:3px;border-left:3px solid transparent}
.nav-item .ic{width:20px;text-align:center;font-size:14px;flex-shrink:0}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(255,153,0,.14);color:#fff;border-left-color:var(--aws-orange)}
.nav-item.active .ic{color:var(--aws-orange)}
.nav-group{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#6b7a8d;padding:14px 16px 6px;font-weight:700}
.content{flex:1;min-width:0}
.page{display:none;animation:fadeUp .5s ease both}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wrap{max-width:860px;margin:0 auto;padding:52px 40px 90px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--aws-orange);margin-bottom:14px}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--aws-orange);display:inline-block}
h1.page-title{font-family:var(--display);font-size:38px;font-weight:700;line-height:1.15;letter-spacing:-.5px;margin-bottom:10px}
.page-lead{font-size:16px;color:var(--ink-soft);margin-bottom:34px;max-width:620px}
h2.sec{font-size:23px;font-weight:700;margin:44px 0 18px;display:flex;align-items:center;gap:12px}
h2.sec .num{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;background:var(--aws-navy);color:#fff;border-radius:10px;font-family:var(--display);font-size:16px;flex-shrink:0}
h3.sub{font-size:17px;font-weight:700;margin:28px 0 12px;color:var(--ink);display:flex;align-items:center;gap:9px}
h3.sub .dot{width:7px;height:7px;border-radius:50%;background:var(--aws-orange)}
p{margin-bottom:12px;color:var(--ink-soft)}
.tag-pending{display:inline-block;font-size:11px;font-style:normal;background:#fff3e0;color:#c47800;border:1px dashed #e0a94d;border-radius:20px;padding:1px 10px;margin-left:6px;vertical-align:middle;font-weight:600}
a{color:var(--kr-blue);text-decoration:none;font-weight:500}
a:hover{text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;box-shadow:var(--shadow-soft);margin-bottom:18px}
.callout{display:flex;gap:16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--aws-orange);border-radius:var(--radius-sm);padding:18px 22px;margin:18px 0;box-shadow:var(--shadow-soft)}
.callout .ci{font-size:20px;color:var(--aws-orange);flex-shrink:0;margin-top:2px}
.callout.note{border-left-color:var(--kr-blue)}.callout.note .ci{color:var(--kr-blue)}
.callout.warn{border-left-color:var(--kr-red)}.callout.warn .ci{color:var(--kr-red)}

.callout p{margin:0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.chip-list{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.chip{display:flex;align-items:flex-start;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;transition:transform .15s ease,box-shadow .15s ease}

.chip .ci{width:44px;height:44px;border-radius:12px;background:var(--bg-tint);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--aws-navy);flex-shrink:0}
.chip .ct b{display:block;font-size:15px;color:var(--ink);margin-bottom:2px}
.chip .ct span{font-size:13.5px;color:var(--ink-soft)}
.speaker{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-soft);margin-bottom:18px;transition:transform .18s ease,box-shadow .18s ease}
.speaker:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.sp-head{display:flex;gap:18px;padding:22px 24px;align-items:center}
.sp-photo{width:72px;height:72px;border-radius:16px;background:linear-gradient(135deg,var(--bg-tint),#dde5f0);display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px dashed #cdd6e3;color:var(--muted);font-size:10px;text-align:center;line-height:1.3}
.sp-photo i{font-size:26px}
.sp-meta{flex:1;min-width:0}

.badge-kr{background:#fde8ea;color:var(--kr-red)}
.badge-aws{background:#fff0d6;color:#b36b00}
.badge-tw{background:#e3f0ff;color:#0047A0}
.sp-name{font-size:18px;font-weight:700;color:var(--ink);line-height:1.3}
.sp-role{font-size:13px;color:var(--muted);margin-top:2px}
.sp-body{padding:0 24px 22px}
.sp-topic{background:var(--bg-tint);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:14px}
.sp-topic .lab{font-size:11px;font-weight:700;color:var(--aws-orange);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:3px}
.sp-topic .tt{color:var(--ink);font-weight:500}
.sp-desc{font-size:14px;color:var(--ink-soft);line-height:1.7;margin:0}
.timeline{position:relative;margin:20px 0 10px;padding-left:8px}
.tl-item{position:relative;padding:0 0 22px 42px;border-left:2px solid var(--line)}
.tl-item:last-child{border-left-color:transparent;padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-8px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--aws-orange);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--aws-orange)}
.tl-time{font-family:var(--display);font-size:14px;font-weight:700;color:var(--aws-navy);margin-bottom:3px}
.tl-desc{font-size:14.5px;color:var(--ink-soft)}
.steps{counter-reset:s;margin:16px 0}
.step{display:flex;gap:14px;margin-bottom:12px;align-items:flex-start}
.step .n{counter-increment:s;flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--aws-navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;font-family:var(--display)}
.step .n::before{content:counter(s)}
.step .sx{font-size:14.5px;color:var(--ink-soft);padding-top:3px}
.inforow{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line-soft);align-items:center}
.inforow:last-child{border-bottom:none}
.inforow .ri{width:38px;height:38px;border-radius:11px;background:var(--bg-tint);display:flex;align-items:center;justify-content:center;color:var(--aws-navy);font-size:16px;flex-shrink:0}
.inforow .rc{flex:1}

.emg{background:linear-gradient(135deg,#fff,#fff8f0);border:1px solid #ffe0b3;border-radius:var(--radius);padding:10px 24px;margin-bottom:16px}
.emg-num{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px dashed #f0dcc0}
.emg-num:last-child{border-bottom:none}
.emg-num .big{font-family:var(--display);font-size:26px;font-weight:700;color:var(--kr-red);min-width:84px}
.emg-num .el b{display:block;font-size:15px;color:var(--ink)}
.emg-num .el span{font-size:13px;color:var(--ink-soft)}
.qr-box{background:var(--bg-tint);border:2px dashed #cdd6e3;border-radius:var(--radius-sm);padding:30px;text-align:center;color:var(--muted);margin:16px 0}
.qr-box i{font-size:44px;display:block;margin-bottom:10px;color:#b8c2d0}
.topbar{display:none}
.cover{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 80% 15%,rgba(255,153,0,.22),transparent 45%),radial-gradient(circle at 15% 85%,rgba(0,71,160,.28),transparent 50%),linear-gradient(135deg,#232F3E 0%,#1a2330 55%,#141b26 100%);color:#fff;overflow:hidden;padding:60px 56px}
.co-glow{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,rgba(255,255,255,.5),transparent),radial-gradient(1.5px 1.5px at 60% 70%,rgba(255,255,255,.35),transparent),radial-gradient(1.5px 1.5px at 80% 20%,rgba(255,255,255,.4),transparent),radial-gradient(1.5px 1.5px at 40% 85%,rgba(255,255,255,.3),transparent);opacity:.6}

.co-aws i{color:#ffffff;font-size:40px}
.co-flags{display:inline-flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:40px;padding:9px 22px;font-size:14px;font-weight:500;margin-bottom:26px}
.co-flags b{color:var(--aws-orange-soft)}
.co-title-en{font-family:var(--display);font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--aws-orange-soft);margin-bottom:12px;font-weight:500}

.co-meta{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:36px}

.co-pill i{color:var(--aws-orange);font-size:18px}
.co-pill b{display:block;font-size:15px;color:#fff;font-family:var(--display)}
.co-pill span{font-size:12px;color:#aab6c6}
.co-tagline{display:inline-flex;align-items:center;gap:10px;font-size:16px;color:#dbe3ec;font-weight:500}
.co-start{margin-top:44px}
.co-start button{background:linear-gradient(120deg,var(--aws-orange),var(--aws-orange-soft));color:#232F3E;border:none;font-family:var(--sans);font-weight:700;font-size:16px;padding:15px 34px;border-radius:40px;cursor:pointer;display:inline-flex;align-items:center;gap:10px;box-shadow:0 12px 30px -8px rgba(255,153,0,.5);transition:transform .18s ease}
.co-start button:hover{transform:translateY(-2px)}
.overlay{display:none}

  .topbar{display:flex;align-items:center;gap:14px;position:sticky;top:0;background:var(--aws-navy);color:#fff;padding:14px 18px;z-index:30}

.pf-btn:hover{border-color:var(--aws-orange);box-shadow:var(--shadow-soft);transform:translateY(-2px)}
.pf-btn .pf-ic{width:36px;height:36px;border-radius:50%;background:var(--bg-tint);display:flex;align-items:center;justify-content:center;color:var(--aws-navy);font-size:14px;flex-shrink:0}

.pf-btn .pf-lab{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.pf-btn.next .pf-lab{color:var(--aws-orange-soft)}
.pf-btn .pf-ttl{display:block;font-size:14px;font-weight:700;line-height:1.3}
.pf-btn.ghost{visibility:hidden}

.m3-body{padding:6px 14px 10px}

function krCard(s){return `
<div class="speaker">
  <div class="sp-head">
    ${s.logo ? `<div class="sp-photo" style="border:1px solid var(--line);background:#fff;padding:8px"><img src="${s.logo}" alt="${s.name}" style="width:100%;height:100%;object-fit:contain"></div>` : `<div class="sp-photo"><i class="fa-regular fa-image"></i></div>`}
    <div class="sp-meta">
      <span class="sp-badge ${s.cls}">${s.badge}</span>
      <div class="sp-name">${s.emoji} ${s.name}</div>
      <div class="sp-role">${s.sub}${s.web?` · <a href="${s.web}" target="_blank" style="font-size:12.5px"><i class="fa-solid fa-globe" style="font-size:11px;margin-right:3px"></i>${s.web.replace(/^https?:\/\//,'').replace(/\/$/,'')}</a>`:''}</div>
    </div>
  </div>
  <div class="sp-body">
    <div class="sp-topic"><span class="lab">講題</span><span class="tt">${s.topic}</span></div>
    <div style="display:flex;align-items:center;gap:10px">${s.photo?`<img src="${s.photo}" alt="${s.speaker}" style="width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--line)">`:''}<p class="sp-desc" style="margin:0"><i class="fa-solid fa-microphone-lines" style="color:var(--aws-orange);margin-right:6px"></i><b style="color:var(--ink)">${s.speaker}</b></p></div>
    <p class="sp-desc" style="margin-top:10px">${s.desc}</p>
  </div>
</div>`;}

function awsCard(s){
  const ph = PHOTOS[s.name];
  const photoHtml = ph ? `<div class="sp-photo" style="border:none;background:none"><img src="${ph}" alt="${s.name}" style="width:100%;height:100%;object-fit:cover;border-radius:16px"></div>` : `<div class="sp-photo"><i class="fa-regular fa-user"></i></div>`;
  return `
<div class="speaker sp-min">
  <div class="sp-head">
    ${photoHtml}
    <div class="sp-meta">
      <span class="sp-badge badge-aws">AWS 講者</span>
      <div class="sp-name">${s.name}</div>
      <div class="sp-role">${s.role}</div>
    </div>
  </div>
  <div class="sp-body">
    <div class="sp-topic"><span class="lab">講題</span><span class="tt">${s.topic}</span></div>
    ${s.desc?`<p class="sp-desc">${s.desc}</p>`:''}
  </div>
</div>`;}

const NAV = [
  {id:'cover',icon:'fa-solid fa-book-open',label:'封面',group:null},
  {id:'ch1',icon:'fa-solid fa-circle-info',label:'行前資訊',group:'手冊內容'},

  {id:'ch4',icon:'fa-solid fa-handshake',label:'Day 3 · 商務媒合',group:null},
  {id:'ch5',icon:'fa-solid fa-circle-exclamation',label:'實用資訊',group:null}
];
const PAGES = [COVER, CH1, CH2, CH3, CH4, CH5];

const pagesEl = document.getElementById('pages');
pagesEl.innerHTML = PAGES.join('');
const navEl = document.getElementById('nav');
let lastGroup = '__';
NAV.forEach((n,i)=>{
  if(n.group && n.group!==lastGroup){ const g=document.createElement('div'); g.className='nav-group'; g.textContent=n.group; navEl.appendChild(g); lastGroup=n.group; }
  const a=document.createElement('a'); a.className='nav-item'+(i===0?' active':''); a.dataset.idx=i;
  a.innerHTML=`<span class="ic"><i class="${n.icon}"></i></span><span>${n.label}</span>`;
  a.onclick=()=>go(i);
  navEl.appendChild(a);
});
const pageEls=[...document.querySelectorAll('.page')];
const navItems=[...document.querySelectorAll('.nav-item')];
function go(i){
  pageEls.forEach((p,j)=>p.classList.toggle('active',j===i));
  navItems.forEach((a)=>a.classList.toggle('active',+a.dataset.idx===i));
  window.scrollTo({top:0,behavior:'auto'});
  const c=document.querySelector('.content'); if(c) c.scrollTop=0;
  closeSidebar();
}
/* mobile */
const sb=document.getElementById('sidebar'), ov=document.getElementById('overlay'), bg=document.getElementById('burger');
function closeSidebar(){ sb.classList.remove('open'); ov.classList.remove('show'); }
if(bg) bg.onclick=()=>{ sb.classList.add('open'); ov.classList.add('show'); };
if(ov) ov.onclick=closeSidebar;
/* ---- per-page prev/next footers ---- */
(function(){
  const wraps = document.querySelectorAll('.page .wrap');
  pageEls.forEach((pg, idx)=>{
    const wrap = pg.querySelector('.wrap');
    if(!wrap) return; // skip cover (no .wrap)
    const prev = NAV[idx-1], next = NAV[idx+1];
    const prevBtn = prev
      ? `<button class="pf-btn prev" onclick="go(${idx-1})"><span class="pf-ic"><i class="fa-solid fa-arrow-left"></i></span><span><span class="pf-lab">上一章</span><span class="pf-ttl">${prev.label}</span></span></button>`
      : `<button class="pf-btn prev ghost"></button>`;
    const nextBtn = next
      ? `<button class="pf-btn next" onclick="go(${idx+1})"><span class="pf-ic"><i class="fa-solid fa-arrow-right"></i></span><span><span class="pf-lab">下一章</span><span class="pf-ttl">${next.label}</span></span></button>`
      : `<button class="pf-btn next" onclick="go(0)"><span class="pf-ic"><i class="fa-solid fa-house"></i></span><span><span class="pf-lab">回到</span><span class="pf-ttl">封面</span></span></button>`;
    const foot = document.createElement('div');
    foot.className = 'page-foot';
    foot.innerHTML = prevBtn + nextBtn;
    wrap.appendChild(foot);
  });
})();

go(0);
